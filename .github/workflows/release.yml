name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-amd64
            runner: ubuntu-latest
            goos: linux
            goarch: amd64
            cgo: "0"
            format: tar
          - target: linux-arm64
            runner: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
            cgo: "0"
            format: tar
          - target: darwin-arm64
            runner: macos-15
            goos: darwin
            goarch: arm64
            cgo: "1"
            format: zip
          - target: darwin-amd64
            runner: macos-15-intel
            goos: darwin
            goarch: amd64
            cgo: "1"
            format: zip
          - target: windows-amd64
            runner: ubuntu-latest
            goos: windows
            goarch: amd64
            cgo: "0"
            format: zip
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Check Apple signing inputs
        if: matrix.goos == 'darwin'
        shell: bash
        env:
          CERTIFICATE_P12: ${{ secrets.APPLE_DEVELOPER_ID_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_PASSWORD }}
          NOTARY_APPLE_ID: ${{ secrets.APPLE_NOTARY_APPLE_ID }}
          NOTARY_TEAM_ID: ${{ secrets.APPLE_NOTARY_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.APPLE_NOTARY_PASSWORD }}
        run: |
          set -euo pipefail
          for value in CERTIFICATE_P12 CERTIFICATE_PASSWORD NOTARY_APPLE_ID NOTARY_TEAM_ID NOTARY_PASSWORD; do
            if [[ -z "${!value}" ]]; then
              echo "Required macOS release secret $value is not configured." >&2
              exit 1
            fi
          done
      - name: Import Developer ID certificate
        if: matrix.goos == 'darwin'
        shell: bash
        env:
          CERTIFICATE_P12: ${{ secrets.APPLE_DEVELOPER_ID_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_PASSWORD }}
        run: |
          set -euo pipefail
          certificate_path="$RUNNER_TEMP/developer-id.p12"
          keychain_path="$RUNNER_TEMP/api-mcp-signing.keychain-db"
          keychain_password=$(openssl rand -hex 24)
          echo "KEYCHAIN_PATH=$keychain_path" >> "$GITHUB_ENV"
          echo "CERTIFICATE_PATH=$certificate_path" >> "$GITHUB_ENV"
          printf '%s' "$CERTIFICATE_P12" | base64 -D > "$certificate_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" -k "$keychain_path" \
            -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$keychain_password" "$keychain_path"
          security list-keychains -d user -s "$keychain_path"
          identity=$(security find-identity -v -p codesigning "$keychain_path" \
            | sed -n 's/.*"\(Developer ID Application:[^"]*\)".*/\1/p' \
            | head -1)
          if [[ -z "$identity" ]]; then
            echo "The certificate does not contain a Developer ID Application identity." >&2
            exit 1
          fi
          echo "SIGNING_IDENTITY=$identity" >> "$GITHUB_ENV"
      - name: Build archive
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: ${{ matrix.cgo }}
          TARGET: ${{ matrix.target }}
          FORMAT: ${{ matrix.format }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          package="api-mcp_${version}_${TARGET}"
          executable="api-mcp"
          if [[ "$GOOS" == windows ]]; then executable="api-mcp.exe"; fi
          mkdir -p "dist/$package"
          VERSION="$version" OUTPUT="dist/$package/$executable" ./scripts/build
          if [[ "$GOOS" == darwin ]]; then
            codesign --force --options runtime --timestamp \
              --identifier io.cortexium.api-mcp \
              --sign "$SIGNING_IDENTITY" \
              "dist/$package/$executable"
            codesign --verify --strict --verbose=2 \
              "dist/$package/$executable"
          fi
          cp README.md LICENSE "dist/$package/"
          if [[ "$FORMAT" == zip ]]; then
            (cd dist && zip -qr "$package.zip" "$package")
            artifact="dist/$package.zip"
          else
            tar -C dist -czf "dist/$package.tar.gz" "$package"
            artifact="dist/$package.tar.gz"
          fi
          rm -rf "dist/$package"
          echo "artifact=$artifact" >> "$GITHUB_ENV"
      - name: Notarize macOS archive
        if: matrix.goos == 'darwin'
        shell: bash
        env:
          NOTARY_APPLE_ID: ${{ secrets.APPLE_NOTARY_APPLE_ID }}
          NOTARY_TEAM_ID: ${{ secrets.APPLE_NOTARY_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.APPLE_NOTARY_PASSWORD }}
        run: |
          set -euo pipefail
          xcrun notarytool submit "$artifact" \
            --apple-id "$NOTARY_APPLE_ID" \
            --team-id "$NOTARY_TEAM_ID" \
            --password "$NOTARY_PASSWORD" \
            --wait
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.target }}
          path: ${{ env.artifact }}
          if-no-files-found: error
      - name: Remove temporary signing material
        if: always() && matrix.goos == 'darwin'
        shell: bash
        run: |
          if [[ -n "${KEYCHAIN_PATH:-}" && -f "$KEYCHAIN_PATH" ]]; then
            security delete-keychain "$KEYCHAIN_PATH"
          fi
          if [[ -n "${CERTIFICATE_PATH:-}" && -f "$CERTIFICATE_PATH" ]]; then
            rm -f "$CERTIFICATE_PATH"
          fi

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true
      - name: Create checksums
        run: (cd dist && sha256sum api-mcp_* > SHA256SUMS)
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          prerelease=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then prerelease+=(--prerelease); fi
          release_notice='> **Beta / AI-generated code:** This is experimental beta software, and much of its code and documentation was generated with AI assistance under human direction and review. Test it with non-production credentials and data before relying on it.'
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "api-mcp $GITHUB_REF_NAME" \
            --notes "$release_notice" \
            --generate-notes \
            "${prerelease[@]}"
